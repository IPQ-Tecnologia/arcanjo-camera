<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel de Eventos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: #f3f4f6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #191e29;
            border-bottom: 1px solid #2d3443;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .status-conexao {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-bolinha {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .status-bolinha.conectado {
            background: #22c55e;
        }

        .status-bolinha.desconectado {
            background: #ef4444;
        }

        main {
            padding: 30px;
        }

        .resumo {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        .resumo-card {
            min-width: 180px;
            padding: 18px;
            background: #191e29;
            border: 1px solid #2d3443;
            border-radius: 10px;
        }

        .resumo-card span {
            display: block;
            color: #9ca3af;
            font-size: 14px;
        }

        .resumo-card strong {
            display: block;
            margin-top: 8px;
            font-size: 28px;
        }

        #eventos {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(310px, 1fr)
            );
            gap: 20px;
        }

        .evento-card {
            overflow: hidden;
            background: #191e29;
            border: 1px solid #2d3443;
            border-radius: 10px;
            transition:
                border-color 0.2s,
                transform 0.2s,
                opacity 0.2s;
        }

        .evento-card.atualizado {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .evento-card.saiu {
            opacity: 0.55;
            border-color: #6b7280;
        }

        .evento-card img {
            width: 100%;
            height: 230px;
            object-fit: contain;
            background: #05070a;
        }

        .evento-dados {
            padding: 15px;
        }

        .evento-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .evento-cabecalho h2 {
            margin: 0;
            font-size: 18px;
        }

        .evento-status {
            padding: 5px 9px;
            border-radius: 999px;
            background: #374151;
            font-size: 12px;
            font-weight: bold;
        }

        .evento-status.entered {
            background: #166534;
            color: #dcfce7;
        }

        .evento-status.updated {
            background: #1e40af;
            color: #dbeafe;
        }

        .evento-status.exited {
            background: #4b5563;
            color: #f3f4f6;
        }

        .evento-dados p {
            margin: 6px 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .aparencia-visual {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #2d3443;
        }

        .aparencia-titulo {
            margin: 0 0 10px;
            font-size: 14px;
            color: #93c5fd;
        }

        .descricao {
            line-height: 1.45;
        }

        .cor-amostra {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 6px;
            border: 1px solid #64748b;
            border-radius: 50%;
            vertical-align: -1px;
        }

        .vazio {
            padding: 40px;
            color: #9ca3af;
            text-align: center;
            background: #191e29;
            border: 1px dashed #374151;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            main {
                padding: 20px;
            }

            .resumo-card {
                flex: 1;
                min-width: 140px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Painel de Eventos das Câmeras</h1>

        <div class="status-conexao">
            <div
                id="status-bolinha"
                class="status-bolinha"
            ></div>

            <span id="status-texto">
                Conectando...
            </span>
        </div>
    </header>

    <main>
        <section class="resumo">
            <div class="resumo-card">
                <span>Pessoas ativas</span>
                <strong id="pessoas-ativas">0</strong>
            </div>

            <div class="resumo-card">
                <span>Pessoas que saíram</span>
                <strong id="pessoas-sairam">0</strong>
            </div>

            <div class="resumo-card">
                <span>Total exibido</span>
                <strong id="total-pessoas">0</strong>
            </div>

            <div class="resumo-card">
                <span>Eventos processados</span>
                <strong id="total-eventos">0</strong>
            </div>
        </section>

        <section id="eventos">
            <div
                id="mensagem-vazia"
                class="vazio"
            >
                Aguardando eventos das câmeras...
            </div>
        </section>
    </main>

    <script>
        const statusBolinha =
            document.getElementById(
                "status-bolinha"
            );

        const statusTexto =
            document.getElementById(
                "status-texto"
            );

        const pessoasAtivasElemento =
            document.getElementById(
                "pessoas-ativas"
            );

        const pessoasSairamElemento =
            document.getElementById(
                "pessoas-sairam"
            );

        const totalPessoasElemento =
            document.getElementById(
                "total-pessoas"
            );

        const totalEventosElemento =
            document.getElementById(
                "total-eventos"
            );

        const eventosElemento =
            document.getElementById(
                "eventos"
            );

        const cartoesPorPessoa =
            new Map();

        const statusPorPessoa =
            new Map();

        let pessoasAtivas = 0;
        let pessoasSairam = 0;
        let totalPessoas = 0;
        let totalEventos = 0;
        let heartbeatId = null;

        function traduzirStatus(status) {
            const traducoes = {
                entered: "Entrou",
                updated: "Atualizado",
                suppressed: "Repetido",
                exited: "Saiu"
            };

            return (
                traducoes[status]
                || status
                || "Detectado"
            );
        }

        function atualizarResumo() {
            pessoasAtivasElemento.textContent =
                pessoasAtivas;

            pessoasSairamElemento.textContent =
                pessoasSairam;

            totalPessoasElemento.textContent =
                totalPessoas;

            totalEventosElemento.textContent =
                totalEventos;
        }

        function registrarMudancaStatus(
            pessoaId,
            novoStatus
        ) {
            const statusAnterior =
                statusPorPessoa.get(
                    pessoaId
                );

            if (!statusAnterior) {
                totalPessoas += 1;

                if (novoStatus === "exited") {
                    pessoasSairam += 1;
                } else {
                    pessoasAtivas += 1;
                }
            }

            else if (
                statusAnterior !== "exited"
                && novoStatus === "exited"
            ) {
                pessoasAtivas = Math.max(
                    0,
                    pessoasAtivas - 1
                );

                pessoasSairam += 1;
            }

            else if (
                statusAnterior === "exited"
                && novoStatus !== "exited"
            ) {
                pessoasSairam = Math.max(
                    0,
                    pessoasSairam - 1
                );

                pessoasAtivas += 1;
            }

            statusPorPessoa.set(
                pessoaId,
                novoStatus
            );

            atualizarResumo();
        }

        function conectarWebSocket() {
            const protocolo =
                window.location.protocol === "https:"
                    ? "wss"
                    : "ws";

            const endereco =
                `${protocolo}://${window.location.host}/ws/eventos`;

            const websocket =
                new WebSocket(endereco);

            websocket.onopen = function () {
                statusTexto.textContent =
                    "Conectado";

                statusBolinha.className =
                    "status-bolinha conectado";

                if (heartbeatId) {
                    clearInterval(
                        heartbeatId
                    );
                }

                heartbeatId = setInterval(
                    function () {
                        if (
                            websocket.readyState
                            === WebSocket.OPEN
                        ) {
                            websocket.send(
                                "ping"
                            );
                        }
                    },
                    20000
                );
            };

            websocket.onmessage =
                function (mensagem) {
                    try {
                        const evento =
                            JSON.parse(
                                mensagem.data
                            );

                        processarEvento(evento);

                    } catch (erro) {
                        console.error(
                            "Erro ao interpretar evento:",
                            erro
                        );
                    }
                };

            websocket.onclose = function () {
                statusTexto.textContent =
                    "Desconectado — reconectando...";

                statusBolinha.className =
                    "status-bolinha desconectado";

                if (heartbeatId) {
                    clearInterval(
                        heartbeatId
                    );

                    heartbeatId = null;
                }

                setTimeout(
                    conectarWebSocket,
                    2000
                );
            };

            websocket.onerror = function () {
                websocket.close();
            };
        }

        function processarEvento(evento) {
            /*
             * Atualização parcial gerada por uma
             * captura que foi suprimida.
             *
             * Não altera os contadores e não muda
             * o status Entrou, Atualizado ou Saiu.
             */
            if (
                evento.status
                === "appearance_updated"
            ) {
                atualizarSomenteAparencia(
                    evento
                );

                return;
            }

            if (
                evento.status
                === "suppressed"
            ) {
                return;
            }

            const pessoaId =
                evento.pessoa_id
                || evento.evento_id;

            if (!pessoaId) {
                console.warn(
                    "Evento sem identificador",
                    evento
                );

                return;
            }

            const cartaoExistente =
                cartoesPorPessoa.get(
                    pessoaId
                );

            if (
                evento.status === "exited"
                && !cartaoExistente
            ) {
                return;
            }

            registrarMudancaStatus(
                pessoaId,
                evento.status || "entered"
            );

            totalEventos += 1;
            atualizarResumo();

            if (cartaoExistente) {
                atualizarCartao(
                    cartaoExistente,
                    evento
                );

                return;
            }

            criarCartao(
                pessoaId,
                evento
            );
        }

        function atualizarSomenteAparencia(
            evento
        ) {
            const pessoaId =
                evento.pessoa_id
                || evento.evento_id;

            const card =
                cartoesPorPessoa.get(
                    pessoaId
                );

            /*
             * Não cria um cartão novo quando o painel
             * não recebeu o evento inicial da pessoa.
             */
            if (!card) {
                console.warn(
                    "Atualização recebida sem cartão:",
                    pessoaId
                );

                return;
            }

            const quantidade =
                card.querySelector(
                    '[data-campo="quantidade"]'
                );

            const aparenciaVisual =
                card.querySelector(
                    '[data-campo="aparencia"]'
                );

            const corRoupa =
                card.querySelector(
                    '[data-campo="cor-roupa"]'
                );

            const posicao =
                card.querySelector(
                    '[data-campo="posicao"]'
                );

            const tamanho =
                card.querySelector(
                    '[data-campo="tamanho"]'
                );

            const percentual =
                card.querySelector(
                    '[data-campo="percentual"]'
                );

            const quantidadeAmostras =
                card.querySelector(
                    '[data-campo="quantidade-amostras"]'
                );

            const descricao =
                card.querySelector(
                    '[data-campo="descricao"]'
                );

            quantidade.textContent =
                `Detecções: ${
                    evento.quantidade_deteccoes
                    || 1
                }`;

            if (evento.aparencia) {
                aparenciaVisual.style.display =
                    "block";

                preencherAparencia(
                    evento.aparencia,
                    corRoupa,
                    posicao,
                    tamanho,
                    percentual,
                    quantidadeAmostras,
                    descricao
                );
            }

            /*
             * Faz o cartão piscar sem alterar
             * o texto atual do status.
             */
            card.classList.add(
                "atualizado"
            );

            setTimeout(
                function () {
                    card.classList.remove(
                        "atualizado"
                    );
                },
                1000
            );
        }

        function criarCartao(
            pessoaId,
            evento
        ) {
            const mensagemVazia =
                document.getElementById(
                    "mensagem-vazia"
                );

            if (mensagemVazia) {
                mensagemVazia.remove();
            }

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "evento-card";

            card.dataset.pessoaId =
                pessoaId;

            const imagem =
                document.createElement(
                    "img"
                );

            imagem.alt =
                "Recorte da pessoa";

            imagem.dataset.campo =
                "imagem";

            const dados =
                document.createElement(
                    "div"
                );

            dados.className =
                "evento-dados";

            const cabecalho =
                document.createElement(
                    "div"
                );

            cabecalho.className =
                "evento-cabecalho";

            const titulo =
                document.createElement(
                    "h2"
                );

            titulo.dataset.campo =
                "camera";

            const status =
                document.createElement(
                    "span"
                );

            status.dataset.campo =
                "status";

            status.className =
                "evento-status";

            const tipo =
                document.createElement(
                    "p"
                );

            tipo.dataset.campo =
                "tipo";

            const horario =
                document.createElement(
                    "p"
                );

            horario.dataset.campo =
                "horario";

            const identificadorPessoa =
                document.createElement(
                    "p"
                );

            identificadorPessoa.dataset.campo =
                "pessoa-id";

            const quantidade =
                document.createElement(
                    "p"
                );

            quantidade.dataset.campo =
                "quantidade";

            const aparencia =
                document.createElement(
                    "section"
                );

            aparencia.className =
                "aparencia-visual";

            aparencia.dataset.campo =
                "aparencia";

            const aparenciaTitulo =
                document.createElement(
                    "h3"
                );

            aparenciaTitulo.className =
                "aparencia-titulo";

            aparenciaTitulo.textContent =
                "Aparência estável";

            const corRoupa =
                document.createElement(
                    "p"
                );

            corRoupa.dataset.campo =
                "cor-roupa";

            const posicao =
                document.createElement(
                    "p"
                );

            posicao.dataset.campo =
                "posicao";

            const tamanho =
                document.createElement(
                    "p"
                );

            tamanho.dataset.campo =
                "tamanho";

            const percentual =
                document.createElement(
                    "p"
                );

            percentual.dataset.campo =
                "percentual";

            const quantidadeAmostras =
                document.createElement(
                    "p"
                );

            quantidadeAmostras.dataset.campo =
                "quantidade-amostras";

            const descricao =
                document.createElement(
                    "p"
                );

            descricao.dataset.campo =
                "descricao";

            descricao.className =
                "descricao";

            cabecalho.appendChild(titulo);
            cabecalho.appendChild(status);

            dados.appendChild(cabecalho);
            dados.appendChild(tipo);
            dados.appendChild(horario);

            dados.appendChild(
                identificadorPessoa
            );

            dados.appendChild(
                quantidade
            );

            aparencia.appendChild(
                aparenciaTitulo
            );

            aparencia.appendChild(
                corRoupa
            );

            aparencia.appendChild(
                posicao
            );

            aparencia.appendChild(
                tamanho
            );

            aparencia.appendChild(
                percentual
            );

            aparencia.appendChild(
                quantidadeAmostras
            );

            aparencia.appendChild(
                descricao
            );

            dados.appendChild(
                aparencia
            );

            card.appendChild(imagem);
            card.appendChild(dados);

            eventosElemento.prepend(
                card
            );

            cartoesPorPessoa.set(
                pessoaId,
                card
            );

            atualizarCartao(
                card,
                evento
            );

            limitarQuantidadeCartoes();
        }

        function preencherAparencia(
            aparencia,
            corRoupa,
            posicao,
            tamanho,
            percentual,
            quantidadeAmostras,
            descricao
        ) {
            const rgb =
                aparencia.rgb_medio;

            let amostraCor = "";

            if (
                Array.isArray(rgb)
                && rgb.length === 3
            ) {
                amostraCor =
                    `<span
                        class="cor-amostra"
                        style="
                            background-color:
                            rgb(
                                ${rgb[0]},
                                ${rgb[1]},
                                ${rgb[2]}
                            );
                        "
                    ></span>`;
            }

            corRoupa.innerHTML =
                `${amostraCor}Cor predominante: ${
                    aparencia
                        .cor_roupa_predominante
                    || "-"
                }`;

            posicao.textContent =
                `Posição atual: ${
                    aparencia.posicao_atual
                    || "-"
                }`;

            tamanho.textContent =
                `Tamanho predominante: ${
                    aparencia
                        .tamanho_predominante
                    || "-"
                }`;

            percentual.textContent =
                `Área média ocupada: ${
                    aparencia
                        .percentual_medio_quadro
                    ?? "-"
                }%`;

            quantidadeAmostras.textContent =
                `Amostras analisadas: ${
                    aparencia
                        .quantidade_amostras
                    || 1
                }`;

            descricao.textContent =
                `Descrição estável: ${
                    aparencia.descricao
                    || "-"
                }`;
        }

        function atualizarCartao(
            card,
            evento
        ) {
            const imagem =
                card.querySelector(
                    '[data-campo="imagem"]'
                );

            const titulo =
                card.querySelector(
                    '[data-campo="camera"]'
                );

            const status =
                card.querySelector(
                    '[data-campo="status"]'
                );

            const tipo =
                card.querySelector(
                    '[data-campo="tipo"]'
                );

            const horario =
                card.querySelector(
                    '[data-campo="horario"]'
                );

            const pessoaId =
                card.querySelector(
                    '[data-campo="pessoa-id"]'
                );

            const quantidade =
                card.querySelector(
                    '[data-campo="quantidade"]'
                );

            const aparenciaVisual =
                card.querySelector(
                    '[data-campo="aparencia"]'
                );

            const corRoupa =
                card.querySelector(
                    '[data-campo="cor-roupa"]'
                );

            const posicao =
                card.querySelector(
                    '[data-campo="posicao"]'
                );

            const tamanho =
                card.querySelector(
                    '[data-campo="tamanho"]'
                );

            const percentual =
                card.querySelector(
                    '[data-campo="percentual"]'
                );

            const quantidadeAmostras =
                card.querySelector(
                    '[data-campo="quantidade-amostras"]'
                );

            const descricao =
                card.querySelector(
                    '[data-campo="descricao"]'
                );

            if (evento.imagem) {
                imagem.src =
                    `data:image/jpeg;base64,${evento.imagem}`;
            }

            if (evento.camera) {
                titulo.textContent =
                    evento.camera;
            }

            status.textContent =
                traduzirStatus(
                    evento.status
                );

            status.className =
                `evento-status ${evento.status || ""}`;

            if (evento.tipo) {
                tipo.textContent =
                    `Evento: ${evento.tipo}`;
            }

            if (
                evento.status === "exited"
            ) {
                horario.textContent =
                    `Saída: ${
                        evento.datetime || "-"
                    }`;
            } else {
                horario.textContent =
                    `Última captura: ${
                        evento.datetime || "-"
                    }`;
            }

            pessoaId.textContent =
                `Pessoa: ${
                    evento.pessoa_id || "-"
                }`;

            quantidade.textContent =
                `Detecções: ${
                    evento.quantidade_deteccoes
                    || 1
                }`;

            if (evento.aparencia) {
                aparenciaVisual.style.display =
                    "block";

                preencherAparencia(
                    evento.aparencia,
                    corRoupa,
                    posicao,
                    tamanho,
                    percentual,
                    quantidadeAmostras,
                    descricao
                );
            }

            card.classList.remove(
                "atualizado",
                "saiu"
            );

            if (
                evento.status === "updated"
            ) {
                card.classList.add(
                    "atualizado"
                );

                eventosElemento.prepend(
                    card
                );

                setTimeout(
                    function () {
                        card.classList.remove(
                            "atualizado"
                        );
                    },
                    1500
                );
            }

            if (
                evento.status === "exited"
            ) {
                card.classList.add(
                    "saiu"
                );
            }
        }

        function limitarQuantidadeCartoes() {
            while (
                eventosElemento.children.length
                > 50
            ) {
                const ultimo =
                    eventosElemento
                    .lastElementChild;

                if (!ultimo) {
                    break;
                }

                const pessoaId =
                    ultimo.dataset.pessoaId;

                if (pessoaId) {
                    const statusRemovido =
                        statusPorPessoa.get(
                            pessoaId
                        );

                    if (
                        statusRemovido
                        === "exited"
                    ) {
                        pessoasSairam =
                            Math.max(
                                0,
                                pessoasSairam - 1
                            );
                    }

                    else if (
                        statusRemovido
                    ) {
                        pessoasAtivas =
                            Math.max(
                                0,
                                pessoasAtivas - 1
                            );
                    }

                    totalPessoas =
                        Math.max(
                            0,
                            totalPessoas - 1
                        );

                    cartoesPorPessoa.delete(
                        pessoaId
                    );

                    statusPorPessoa.delete(
                        pessoaId
                    );
                }

                ultimo.remove();
            }

            atualizarResumo();
        }

        atualizarResumo();
        conectarWebSocket();
    </script>
</body>
</html>
