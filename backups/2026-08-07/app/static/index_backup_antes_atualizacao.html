<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel de Eventos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: #f3f4f6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #191e29;
            border-bottom: 1px solid #2d3443;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-bolinha {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .status-bolinha.conectado {
            background: #22c55e;
        }

        .status-bolinha.desconectado {
            background: #ef4444;
        }

        main {
            padding: 30px;
        }

        .resumo {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .resumo-card {
            min-width: 180px;
            padding: 18px;
            background: #191e29;
            border: 1px solid #2d3443;
            border-radius: 10px;
        }

        .resumo-card span {
            display: block;
            color: #9ca3af;
            font-size: 14px;
        }

        .resumo-card strong {
            display: block;
            margin-top: 8px;
            font-size: 28px;
        }

        #eventos {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(280px, 1fr)
            );
            gap: 20px;
        }

        .evento-card {
            overflow: hidden;
            background: #191e29;
            border: 1px solid #2d3443;
            border-radius: 10px;
        }

        .evento-card img {
            width: 100%;
            height: 230px;
            object-fit: contain;
            background: #05070a;
        }

        .evento-dados {
            padding: 15px;
        }

        .evento-dados h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .evento-dados p {
            margin: 6px 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .vazio {
            padding: 40px;
            color: #9ca3af;
            text-align: center;
            background: #191e29;
            border: 1px dashed #374151;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Painel de Eventos das Câmeras</h1>

        <div class="status">
            <div
                id="status-bolinha"
                class="status-bolinha"
            ></div>

            <span id="status-texto">
                Conectando...
            </span>
        </div>
    </header>

    <main>
        <section class="resumo">
            <div class="resumo-card">
                <span>Eventos recebidos</span>
                <strong id="total-eventos">0</strong>
            </div>
        </section>

        <section id="eventos">
            <div id="mensagem-vazia" class="vazio">
                Aguardando eventos das câmeras...
            </div>
        </section>
    </main>

    <script>
        const statusBolinha =
            document.getElementById("status-bolinha");

        const statusTexto =
            document.getElementById("status-texto");

        const totalEventosElemento =
            document.getElementById("total-eventos");

        const eventosElemento =
            document.getElementById("eventos");

        let totalEventos = 0;

        function conectarWebSocket() {
            const protocolo =
                window.location.protocol === "https:"
                    ? "wss"
                    : "ws";

            const endereco =
                `${protocolo}://${window.location.host}/ws/eventos`;

            const websocket = new WebSocket(endereco);

            websocket.onopen = function () {
                statusTexto.textContent = "Conectado";

                statusBolinha.className =
                    "status-bolinha conectado";
            };

            websocket.onmessage = function (mensagem) {
                const evento = JSON.parse(mensagem.data);

                adicionarEvento(evento);
            };

            websocket.onclose = function () {
                statusTexto.textContent =
                    "Desconectado — reconectando...";

                statusBolinha.className =
                    "status-bolinha desconectado";

                setTimeout(conectarWebSocket, 2000);
            };

            websocket.onerror = function () {
                websocket.close();
            };

            setInterval(function () {
                if (
                    websocket.readyState ===
                    WebSocket.OPEN
                ) {
                    websocket.send("ping");
                }
            }, 20000);
        }

        function adicionarEvento(evento) {
            const mensagemVazia =
                document.getElementById("mensagem-vazia");

            if (mensagemVazia) {
                mensagemVazia.remove();
            }

            totalEventos += 1;
            totalEventosElemento.textContent = totalEventos;

            const card = document.createElement("article");
            card.className = "evento-card";

            const imagem = document.createElement("img");

            if (evento.imagem) {
                imagem.src =
                    `data:image/jpeg;base64,${evento.imagem}`;
            }

            imagem.alt = "Recorte da detecção";

            const dados = document.createElement("div");
            dados.className = "evento-dados";

            const titulo = document.createElement("h2");
            titulo.textContent =
                evento.camera || "Câmera não identificada";

            const tipo = document.createElement("p");
            tipo.textContent =
                `Evento: ${evento.tipo || "desconhecido"}`;

            const horario = document.createElement("p");
            horario.textContent =
                `Horário: ${evento.datetime || "-"}`;

            const identificador =
                document.createElement("p");

            identificador.textContent =
                `ID: ${evento.evento_id || "-"}`;

            dados.appendChild(titulo);
            dados.appendChild(tipo);
            dados.appendChild(horario);
            dados.appendChild(identificador);

            card.appendChild(imagem);
            card.appendChild(dados);

            eventosElemento.prepend(card);

            while (eventosElemento.children.length > 50) {
                eventosElemento.lastElementChild.remove();
            }
        }

        conectarWebSocket();
    </script>
</body>
</html>
