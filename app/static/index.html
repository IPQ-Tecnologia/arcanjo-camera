<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel de Eventos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: #f3f4f6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #191e29;
            border-bottom: 1px solid #2d3443;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .status-conexao {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-bolinha {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .status-bolinha.conectado {
            background: #22c55e;
        }

        .status-bolinha.desconectado {
            background: #ef4444;
        }

        main {
            padding: 30px;
        }

        .resumo {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        .resumo-card {
            min-width: 180px;
            padding: 18px;
            background: #191e29;
            border: 1px solid #2d3443;
            border-radius: 10px;
        }

        .resumo-card span {
            display: block;
            color: #9ca3af;
            font-size: 14px;
        }

        .resumo-card strong {
            display: block;
            margin-top: 8px;
            font-size: 28px;
        }

        #eventos {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(400px, 1fr)
            );
            gap: 20px;
        }

        .evento-card {
            overflow: hidden;
            background: #191e29;
            border: 1px solid #2d3443;
            border-radius: 10px;
            transition:
                border-color 0.2s,
                transform 0.2s,
                opacity 0.2s;
        }

        .evento-card.atualizado {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .evento-card.saiu {
            opacity: 0.55;
            border-color: #6b7280;
        }

        .imagens-evento {
            display: flex;
            flex-direction: column;
            background: #05070a;
        }

        .imagem-bloco {
            display: none;
            border-bottom: 1px solid #2d3443;
        }

        .imagem-bloco:last-child {
            border-bottom: none;
        }

        .imagem-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 38px;
            padding: 9px 12px;
            background: #111827;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: bold;
        }

        .imagem-contagem {
            color: #86efac;
            font-size: 12px;
        }

        .imagem-evento {
            display: block;
            width: 100%;
            background: #05070a;
            cursor: zoom-in;
        }

        .imagem-recorte {
            height: 260px;
            object-fit: contain;
        }

        .imagem-rosto {
            height: 230px;
            object-fit: contain;
            background: #05070a;
        }

        .imagem-cena {
            aspect-ratio: 16 / 9;
            max-height: 440px;
            object-fit: contain;
        }

        .evento-dados {
            padding: 15px;
        }

        .evento-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .evento-cabecalho h2 {
            margin: 0;
            font-size: 18px;
        }

        .evento-status {
            padding: 5px 9px;
            border-radius: 999px;
            background: #374151;
            font-size: 12px;
            font-weight: bold;
        }

        .evento-status.entered {
            background: #166534;
            color: #dcfce7;
        }

        .evento-status.updated {
            background: #1e40af;
            color: #dbeafe;
        }

        .evento-status.exited {
            background: #4b5563;
            color: #f3f4f6;
        }

        .evento-dados p {
            margin: 6px 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .aparencia-visual,
        .movimento-pessoa,
        .contexto-cena {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #2d3443;
        }

        .secao-titulo {
            margin: 0 0 10px;
            font-size: 14px;
            color: #93c5fd;
        }

        .movimento-pessoa .secao-titulo {
            color: #fbbf24;
        }

        .contexto-cena .secao-titulo {
            color: #86efac;
        }

        .descricao {
            line-height: 1.45;
        }

        .detalhes-pessoas {
            line-height: 1.5;
            white-space: pre-line;
        }

        .cor-amostra {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 6px;
            border: 1px solid #64748b;
            border-radius: 50%;
            vertical-align: -1px;
        }

        .vazio {
            padding: 40px;
            color: #9ca3af;
            text-align: center;
            background: #191e29;
            border: 1px dashed #374151;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            main {
                padding: 20px;
            }

            #eventos {
                grid-template-columns: 1fr;
            }

            .resumo-card {
                flex: 1;
                min-width: 140px;
            }

            .imagem-recorte {
                height: 230px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Painel de Eventos das Câmeras</h1>

        <div class="status-conexao">
            <div
                id="status-bolinha"
                class="status-bolinha"
            ></div>

            <span id="status-texto">
                Conectando...
            </span>
        </div>
    </header>

    <main>
        <section class="resumo">
            <div class="resumo-card">
                <span>Pessoas ativas</span>
                <strong id="pessoas-ativas">0</strong>
            </div>

            <div class="resumo-card">
                <span>Pessoas que saíram</span>
                <strong id="pessoas-sairam">0</strong>
            </div>

            <div class="resumo-card">
                <span>Total exibido</span>
                <strong id="total-pessoas">0</strong>
            </div>

            <div class="resumo-card">
                <span>Eventos processados</span>
                <strong id="total-eventos">0</strong>
            </div>
        </section>

        <section id="eventos">
            <div
                id="mensagem-vazia"
                class="vazio"
            >
                Aguardando eventos das câmeras...
            </div>
        </section>
    </main>

    <script>
        const statusBolinha =
            document.getElementById(
                "status-bolinha"
            );

        const statusTexto =
            document.getElementById(
                "status-texto"
            );

        const pessoasAtivasElemento =
            document.getElementById(
                "pessoas-ativas"
            );

        const pessoasSairamElemento =
            document.getElementById(
                "pessoas-sairam"
            );

        const totalPessoasElemento =
            document.getElementById(
                "total-pessoas"
            );

        const totalEventosElemento =
            document.getElementById(
                "total-eventos"
            );

        const eventosElemento =
            document.getElementById(
                "eventos"
            );

        const cartoesPorPessoa =
            new Map();

        const statusPorPessoa =
            new Map();

        let pessoasAtivas = 0;
        let pessoasSairam = 0;
        let totalPessoas = 0;
        let totalEventos = 0;
        let heartbeatId = null;

        function traduzirStatus(status) {
            const traducoes = {
                entered: "Entrou",
                updated: "Atualizado",
                suppressed: "Repetido",
                exited: "Saiu"
            };

            return (
                traducoes[status]
                || status
                || "Detectado"
            );
        }

        function atualizarResumo() {
            pessoasAtivasElemento.textContent =
                pessoasAtivas;

            pessoasSairamElemento.textContent =
                pessoasSairam;

            totalPessoasElemento.textContent =
                totalPessoas;

            totalEventosElemento.textContent =
                totalEventos;
        }

        function registrarMudancaStatus(
            pessoaId,
            novoStatus
        ) {
            const statusAnterior =
                statusPorPessoa.get(
                    pessoaId
                );

            if (!statusAnterior) {
                totalPessoas += 1;

                if (novoStatus === "exited") {
                    pessoasSairam += 1;
                } else {
                    pessoasAtivas += 1;
                }
            }

            else if (
                statusAnterior !== "exited"
                && novoStatus === "exited"
            ) {
                pessoasAtivas = Math.max(
                    0,
                    pessoasAtivas - 1
                );

                pessoasSairam += 1;
            }

            else if (
                statusAnterior === "exited"
                && novoStatus !== "exited"
            ) {
                pessoasSairam = Math.max(
                    0,
                    pessoasSairam - 1
                );

                pessoasAtivas += 1;
            }

            statusPorPessoa.set(
                pessoaId,
                novoStatus
            );

            atualizarResumo();
        }

        function conectarWebSocket() {
            const protocolo =
                window.location.protocol === "https:"
                    ? "wss"
                    : "ws";

            const endereco =
                `${protocolo}://${window.location.host}/ws/eventos`;

            const websocket =
                new WebSocket(endereco);

            websocket.onopen = function () {
                statusTexto.textContent =
                    "Conectado";

                statusBolinha.className =
                    "status-bolinha conectado";

                if (heartbeatId) {
                    clearInterval(
                        heartbeatId
                    );
                }

                heartbeatId = setInterval(
                    function () {
                        if (
                            websocket.readyState
                            === WebSocket.OPEN
                        ) {
                            websocket.send(
                                "ping"
                            );
                        }
                    },
                    20000
                );
            };

            websocket.onmessage =
                function (mensagem) {
                    try {
                        const evento =
                            JSON.parse(
                                mensagem.data
                            );

                        processarEvento(
                            evento
                        );

                    } catch (erro) {
                        console.error(
                            "Erro ao interpretar evento:",
                            erro
                        );
                    }
                };

            websocket.onclose = function () {
                statusTexto.textContent =
                    "Desconectado — reconectando...";

                statusBolinha.className =
                    "status-bolinha desconectado";

                if (heartbeatId) {
                    clearInterval(
                        heartbeatId
                    );

                    heartbeatId = null;
                }

                setTimeout(
                    conectarWebSocket,
                    2000
                );
            };

            websocket.onerror = function () {
                websocket.close();
            };
        }

        function processarEvento(evento) {
            if (
                evento.status
                === "appearance_updated"
            ) {
                atualizarEventoParcial(
                    evento
                );

                return;
            }

            if (
                evento.status
                === "suppressed"
            ) {
                return;
            }

            const pessoaId =
                evento.pessoa_id
                || evento.evento_id;

            if (!pessoaId) {
                console.warn(
                    "Evento sem identificador:",
                    evento
                );

                return;
            }

            const cartaoExistente =
                cartoesPorPessoa.get(
                    pessoaId
                );

            if (
                evento.status === "exited"
                && !cartaoExistente
            ) {
                return;
            }

            registrarMudancaStatus(
                pessoaId,
                evento.status || "entered"
            );

            totalEventos += 1;
            atualizarResumo();

            if (cartaoExistente) {
                atualizarCartao(
                    cartaoExistente,
                    evento
                );

                return;
            }

            criarCartao(
                pessoaId,
                evento
            );
        }

        function criarElemento(
            tag,
            campo,
            classe = ""
        ) {
            const elemento =
                document.createElement(
                    tag
                );

            if (campo) {
                elemento.dataset.campo =
                    campo;
            }

            if (classe) {
                elemento.className =
                    classe;
            }

            return elemento;
        }

        function obterCamposCard(card) {
            return {
                blocoRecorte: card.querySelector(
                    '[data-campo="bloco-recorte"]'
                ),

                imagemRecorte: card.querySelector(
                    '[data-campo="imagem-recorte"]'
                ),

                blocoRosto: card.querySelector(
                    '[data-campo="bloco-rosto"]'
                ),

                imagemRosto: card.querySelector(
                    '[data-campo="imagem-rosto"]'
                ),

                blocoCena: card.querySelector(
                    '[data-campo="bloco-cena"]'
                ),

                tituloCena: card.querySelector(
                    '[data-campo="titulo-cena"]'
                ),

                quantidadeBoxes: card.querySelector(
                    '[data-campo="quantidade-boxes"]'
                ),

                imagemCena: card.querySelector(
                    '[data-campo="imagem-cena"]'
                ),

                camera: card.querySelector(
                    '[data-campo="camera"]'
                ),

                status: card.querySelector(
                    '[data-campo="status"]'
                ),

                tipo: card.querySelector(
                    '[data-campo="tipo"]'
                ),

                horario: card.querySelector(
                    '[data-campo="horario"]'
                ),

                pessoaId: card.querySelector(
                    '[data-campo="pessoa-id"]'
                ),

                quantidade: card.querySelector(
                    '[data-campo="quantidade"]'
                ),

                aparencia: card.querySelector(
                    '[data-campo="aparencia"]'
                ),

                aparenciaTitulo: card.querySelector(
                    '[data-campo="aparencia-titulo"]'
                ),

                corRoupa: card.querySelector(
                    '[data-campo="cor-roupa"]'
                ),

                posicao: card.querySelector(
                    '[data-campo="posicao"]'
                ),

                tamanho: card.querySelector(
                    '[data-campo="tamanho"]'
                ),

                percentual: card.querySelector(
                    '[data-campo="percentual"]'
                ),

                quantidadeAmostras: card.querySelector(
                    '[data-campo="quantidade-amostras"]'
                ),

                descricaoAparencia: card.querySelector(
                    '[data-campo="descricao-aparencia"]'
                ),

                movimento: card.querySelector(
                    '[data-campo="movimento"]'
                ),

                movimentoHorizontal: card.querySelector(
                    '[data-campo="movimento-horizontal"]'
                ),

                movimentoVertical: card.querySelector(
                    '[data-campo="movimento-vertical"]'
                ),

                movimentoTendencia: card.querySelector(
                    '[data-campo="movimento-tendencia"]'
                ),

                movimentoVelocidade: card.querySelector(
                    '[data-campo="movimento-velocidade"]'
                ),

                movimentoDistancia: card.querySelector(
                    '[data-campo="movimento-distancia"]'
                ),

                movimentoTempo: card.querySelector(
                    '[data-campo="movimento-tempo"]'
                ),

                movimentoAmostras: card.querySelector(
                    '[data-campo="movimento-amostras"]'
                ),

                movimentoDescricao: card.querySelector(
                    '[data-campo="movimento-descricao"]'
                ),

                contexto: card.querySelector(
                    '[data-campo="contexto"]'
                ),

                contextoQuantidade: card.querySelector(
                    '[data-campo="contexto-quantidade"]'
                ),

                contextoDistribuicao: card.querySelector(
                    '[data-campo="contexto-distribuicao"]'
                ),

                contextoProximidades: card.querySelector(
                    '[data-campo="contexto-proximidades"]'
                ),

                contextoPessoas: card.querySelector(
                    '[data-campo="contexto-pessoas"]'
                ),

                contextoDescricao: card.querySelector(
                    '[data-campo="contexto-descricao"]'
                )
            };
        }

        function atualizarEventoParcial(
            evento
        ) {
            const pessoaId =
                evento.pessoa_id
                || evento.evento_id;

            const card =
                cartoesPorPessoa.get(
                    pessoaId
                );

            if (!card) {
                console.warn(
                    "Atualização recebida sem cartão:",
                    pessoaId
                );

                return;
            }

            const campos =
                obterCamposCard(card);

            campos.quantidade.textContent =
                `Detecções: ${
                    evento.quantidade_deteccoes
                    || 1
                }`;

            if (evento.imagem) {
                preencherRecorte(
                    evento.imagem,
                    campos
                );
            }

            if (evento.imagem_rosto) {
                preencherRosto(
                    evento.imagem_rosto,
                    campos
                );
            }

            if (evento.aparencia) {
                preencherAparencia(
                    evento.aparencia,
                    campos
                );
            }

            if (evento.movimento) {
                preencherMovimento(
                    evento.movimento,
                    campos
                );
            }

            if (evento.contexto_cena) {
                preencherContextoCena(
                    evento.contexto_cena,
                    campos
                );
            }

            if (evento.imagem_cena) {
                preencherCenaCompleta(
                    evento.imagem_cena,
                    evento.quantidade_boxes_cena,
                    campos
                );
            }

            card.classList.add(
                "atualizado"
            );

            setTimeout(
                function () {
                    card.classList.remove(
                        "atualizado"
                    );
                },
                1000
            );
        }

        function criarCartao(
            pessoaId,
            evento
        ) {
            const mensagemVazia =
                document.getElementById(
                    "mensagem-vazia"
                );

            if (mensagemVazia) {
                mensagemVazia.remove();
            }

            const card =
                criarElemento(
                    "article",
                    "",
                    "evento-card"
                );

            card.dataset.pessoaId =
                pessoaId;

            const imagensEvento =
                criarElemento(
                    "section",
                    "",
                    "imagens-evento"
                );

            const blocoRecorte =
                criarElemento(
                    "div",
                    "bloco-recorte",
                    "imagem-bloco"
                );

            const tituloRecorte =
                criarElemento(
                    "div",
                    "",
                    "imagem-titulo"
                );

            tituloRecorte.textContent =
                "Recorte individual";

            const imagemRecorte =
                criarElemento(
                    "img",
                    "imagem-recorte",
                    "imagem-evento imagem-recorte"
                );

            imagemRecorte.alt =
                "Recorte individual da pessoa";

            imagemRecorte.title =
                "Clique para ampliar";

            imagemRecorte.addEventListener(
                "click",
                () => {
                    abrirImagemAmpliada(
                        imagemRecorte.src,
                        "Recorte individual"
                    );
                }
            );

            blocoRecorte.appendChild(
                tituloRecorte
            );

            blocoRecorte.appendChild(
                imagemRecorte
            );

            const blocoRosto =
                criarElemento(
                    "div",
                    "bloco-rosto",
                    "imagem-bloco"
                );

            const tituloRosto =
                criarElemento(
                    "div",
                    "",
                    "imagem-titulo"
                );

            tituloRosto.textContent =
                "Recorte facial";

            const imagemRosto =
                criarElemento(
                    "img",
                    "imagem-rosto",
                    "imagem-evento imagem-rosto"
                );

            imagemRosto.alt =
                "Recorte facial da pessoa";

            blocoRosto.appendChild(
                tituloRosto
            );

            blocoRosto.appendChild(
                imagemRosto
            );

            const blocoCena =
                criarElemento(
                    "div",
                    "bloco-cena",
                    "imagem-bloco"
                );

            const cabecalhoCena =
                criarElemento(
                    "div",
                    "",
                    "imagem-titulo"
                );

            const tituloCena =
                criarElemento(
                    "span",
                    "titulo-cena"
                );

            tituloCena.textContent =
                "Cena completa";

            const quantidadeBoxes =
                criarElemento(
                    "span",
                    "quantidade-boxes",
                    "imagem-contagem"
                );

            quantidadeBoxes.textContent =
                "0 detecções";

            cabecalhoCena.appendChild(
                tituloCena
            );

            cabecalhoCena.appendChild(
                quantidadeBoxes
            );

            const imagemCena =
                criarElemento(
                    "img",
                    "imagem-cena",
                    "imagem-evento imagem-cena"
                );

            imagemCena.alt =
                "Cena completa com as detecções";

            imagemCena.title =
                "Clique para ampliar";

            imagemCena.addEventListener(
                "click",
                () => {
                    abrirImagemAmpliada(
                        imagemCena.src,
                        "Cena completa da câmera"
                    );
                }
            );

            blocoCena.appendChild(
                cabecalhoCena
            );

            blocoCena.appendChild(
                imagemCena
            );

            imagensEvento.appendChild(
                blocoRecorte
            );

            imagensEvento.appendChild(
                blocoRosto
            );

            imagensEvento.appendChild(
                blocoCena
            );

            const dados =
                criarElemento(
                    "div",
                    "",
                    "evento-dados"
                );

            const cabecalho =
                criarElemento(
                    "div",
                    "",
                    "evento-cabecalho"
                );

            const titulo =
                criarElemento(
                    "h2",
                    "camera"
                );

            const status =
                criarElemento(
                    "span",
                    "status",
                    "evento-status"
                );

            cabecalho.appendChild(
                titulo
            );

            cabecalho.appendChild(
                status
            );

            const tipo =
                criarElemento(
                    "p",
                    "tipo"
                );

            const horario =
                criarElemento(
                    "p",
                    "horario"
                );

            const identificadorPessoa =
                criarElemento(
                    "p",
                    "pessoa-id"
                );

            const quantidade =
                criarElemento(
                    "p",
                    "quantidade"
                );

            const aparencia =
                criarElemento(
                    "section",
                    "aparencia",
                    "aparencia-visual"
                );

            const aparenciaTitulo =
                criarElemento(
                    "h3",
                    "aparencia-titulo",
                    "secao-titulo"
                );

            aparenciaTitulo.textContent =
                "Aparência estável";

            const corRoupa =
                criarElemento(
                    "p",
                    "cor-roupa"
                );

            const posicao =
                criarElemento(
                    "p",
                    "posicao"
                );

            const tamanho =
                criarElemento(
                    "p",
                    "tamanho"
                );

            const percentual =
                criarElemento(
                    "p",
                    "percentual"
                );

            const quantidadeAmostras =
                criarElemento(
                    "p",
                    "quantidade-amostras"
                );

            const descricaoAparencia =
                criarElemento(
                    "p",
                    "descricao-aparencia",
                    "descricao"
                );

            aparencia.appendChild(
                aparenciaTitulo
            );

            aparencia.appendChild(
                corRoupa
            );

            aparencia.appendChild(
                posicao
            );

            aparencia.appendChild(
                tamanho
            );

            aparencia.appendChild(
                percentual
            );

            aparencia.appendChild(
                quantidadeAmostras
            );

            aparencia.appendChild(
                descricaoAparencia
            );

            const movimento =
                criarElemento(
                    "section",
                    "movimento",
                    "movimento-pessoa"
                );

            const movimentoTitulo =
                criarElemento(
                    "h3",
                    "",
                    "secao-titulo"
                );

            movimentoTitulo.textContent =
                "Movimento e permanência";

            const movimentoHorizontal =
                criarElemento(
                    "p",
                    "movimento-horizontal"
                );

            const movimentoVertical =
                criarElemento(
                    "p",
                    "movimento-vertical"
                );

            const movimentoTendencia =
                criarElemento(
                    "p",
                    "movimento-tendencia"
                );

            const movimentoVelocidade =
                criarElemento(
                    "p",
                    "movimento-velocidade"
                );

            const movimentoDistancia =
                criarElemento(
                    "p",
                    "movimento-distancia"
                );

            const movimentoTempo =
                criarElemento(
                    "p",
                    "movimento-tempo"
                );

            const movimentoAmostras =
                criarElemento(
                    "p",
                    "movimento-amostras"
                );

            const movimentoDescricao =
                criarElemento(
                    "p",
                    "movimento-descricao",
                    "descricao"
                );

            movimento.appendChild(
                movimentoTitulo
            );

            movimento.appendChild(
                movimentoHorizontal
            );

            movimento.appendChild(
                movimentoVertical
            );

            movimento.appendChild(
                movimentoTendencia
            );

            movimento.appendChild(
                movimentoVelocidade
            );

            movimento.appendChild(
                movimentoDistancia
            );

            movimento.appendChild(
                movimentoTempo
            );

            movimento.appendChild(
                movimentoAmostras
            );

            movimento.appendChild(
                movimentoDescricao
            );

            const contexto =
                criarElemento(
                    "section",
                    "contexto",
                    "contexto-cena"
                );

            const contextoTitulo =
                criarElemento(
                    "h3",
                    "",
                    "secao-titulo"
                );

            contextoTitulo.textContent =
                "Contexto da cena";

            const contextoQuantidade =
                criarElemento(
                    "p",
                    "contexto-quantidade"
                );

            const contextoDistribuicao =
                criarElemento(
                    "p",
                    "contexto-distribuicao"
                );

            const contextoProximidades =
                criarElemento(
                    "p",
                    "contexto-proximidades"
                );

            const contextoPessoas =
                criarElemento(
                    "p",

            );

            contexto.appendChild(

            card.appendChild(

            );

            card.appendChild(
                dados
            );

            eventosElemento.prepend(
                card
            );

            cartoesPorPessoa.set(
                pessoaId,
                card
            );

            atualizarCartao(
                card,
                evento
            );

            limitarQuantidadeCartoes();
        }

        function abrirImagemAmpliada(
            origem,
            titulo
        ) {
            if (!origem) {
                return;
            }

            const janela = window.open(
                "",
                "_blank"
            );

            if (!janela) {
                return;
            }

            janela.document.title =
                titulo || "Imagem ampliada";

            janela.document.body.style.margin =
                "0";

            janela.document.body.style.background =
                "#05070a";

            janela.document.body.style.width =
                "100vw";

            janela.document.body.style.height =
                "100vh";

            janela.document.body.style.display =
                "flex";

            janela.document.body.style.alignItems =
                "center";

            janela.document.body.style.justifyContent =
                "center";

            janela.document.body.style.overflow =
                "hidden";

            const imagem =
                janela.document.createElement(
                    "img"
                );

            imagem.src = origem;
            imagem.alt =
                titulo || "Imagem ampliada";

            imagem.style.width = "100vw";
            imagem.style.height = "100vh";
            imagem.style.objectFit = "contain";
            imagem.style.background = "#05070a";

            janela.document.body.appendChild(
                imagem
            );

            janela.opener = null;
        }

        function preencherRecorte(
            imagemBase64,
            campos
        ) {
            if (!imagemBase64) {
                return;
            }

            campos.blocoRecorte.style.display =
                "block";

            campos.imagemRecorte.src =
                `data:image/jpeg;base64,${imagemBase64}`;
        }

        function preencherRosto(
            imagemBase64,
            campos
        ) {
            if (
                !imagemBase64
                || !campos.blocoRosto
                || !campos.imagemRosto
            ) {
                return;
            }

            campos.blocoRosto.style.display =
                "block";

            campos.imagemRosto.src =
                `data:image/jpeg;base64,${imagemBase64}`;
        }

        function preencherCenaCompleta(
            imagemBase64,
            quantidadeBoxes,
            campos
        ) {
            if (!imagemBase64) {
                return;
            }

            const quantidade =
                Number(
                    quantidadeBoxes || 0
                );

            campos.blocoCena.style.display =
                "block";

            campos.imagemCena.src =
                `data:image/jpeg;base64,${imagemBase64}`;

            campos.tituloCena.textContent =
                "Cena completa com detecções";

            if (quantidade === 1) {
                campos.quantidadeBoxes.textContent =
                    "1 detecção";
            } else {
                campos.quantidadeBoxes.textContent =
                    `${quantidade} detecções`;
            }
        }

        function preencherAparencia(
            aparencia,
            campos
        ) {
            campos.aparencia.style.display =
                "block";

            const corPredominante =
                aparencia.cor_roupa_predominante
                || "indefinida";

            const corConfirmada =
                corPredominante !== "indefinida";

            if (campos.aparenciaTitulo) {
                campos.aparenciaTitulo.textContent =
                    corConfirmada
                        ? "Aparência estável"
                        : "Aparência em análise";
            }

            const rgb =
                aparencia.rgb_medio;

            let amostraCor = "";

            if (
                corConfirmada
                && Array.isArray(rgb)
                && rgb.length === 3
            ) {
                amostraCor =
                    `<span
                        class="cor-amostra"
                        style="
                            background-color:
                            rgb(
                                ${rgb[0]},
                                ${rgb[1]},
                                ${rgb[2]}
                            );
                        "
                    ></span>`;
            }

            if (corConfirmada) {
                campos.corRoupa.innerHTML =
                    `${amostraCor}Cor predominante: ${
                        corPredominante
                    }`;
            } else {
                campos.corRoupa.textContent =
                    "Cor predominante: analisando...";
            }

            campos.posicao.textContent =
                `Posição atual: ${
                    aparencia.posicao_atual
                    || "-"
                }`;

            campos.tamanho.textContent =
                `Tamanho predominante: ${
                    aparencia.tamanho_predominante
                    || "-"
                }`;

            campos.percentual.textContent =
                `Área média ocupada: ${
                    aparencia.percentual_medio_quadro
                    ?? "-"
                }%`;

            campos.quantidadeAmostras.textContent =
                `Amostras analisadas: ${
                    aparencia.quantidade_amostras
                    || 1
                }`;

            if (corConfirmada) {
                campos.descricaoAparencia.textContent =
                    `Descrição estável: ${
                        aparencia.descricao
                        || "-"
                    }`;
            } else {
                campos.descricaoAparencia.textContent =
                    "Aguardando leituras consistentes "
                    + "para confirmar a cor da roupa.";
            }
        }

        function formatarTextoMovimento(
            valor
        ) {
            if (
                valor === null
                || valor === undefined
                || valor === ""
            ) {
                return "-";
            }

            const texto = String(valor)
                .replaceAll("_", " ");

            return (
                texto.charAt(0).toUpperCase()
                + texto.slice(1)
            );
        }

        function formatarNumeroMovimento(
            valor,
            casasDecimais = 2
        ) {
            const numero = Number(valor);

            if (!Number.isFinite(numero)) {
                return "-";
            }

            return numero.toLocaleString(
                "pt-BR",
                {
                    minimumFractionDigits:
                        casasDecimais,
                    maximumFractionDigits:
                        casasDecimais
                }
            );
        }

        function preencherMovimento(
            movimento,
            campos
        ) {
            if (
                !movimento
                || !campos.movimento
            ) {
                return;
            }

            campos.movimento.style.display =
                "block";

            campos.movimentoHorizontal.textContent =
                `Direção horizontal: ${
                    formatarTextoMovimento(
                        movimento
                            .movimento_horizontal
                    )
                }`;

            campos.movimentoVertical.textContent =
                `Direção vertical: ${
                    formatarTextoMovimento(
                        movimento
                            .movimento_vertical
                    )
                }`;

            campos.movimentoTendencia.textContent =
                `Distância aparente: ${
                    formatarTextoMovimento(
                        movimento
                            .tendencia_distancia
                    )
                }`;

            campos.movimentoVelocidade.textContent =
                `Velocidade aproximada: ${
                    formatarNumeroMovimento(
                        movimento
                            .velocidade_pixels_segundo
                        ?? 0
                    )
                } px/s`;

            campos.movimentoDistancia.textContent =
                `Distância percorrida: ${
                    formatarNumeroMovimento(
                        movimento
                            .distancia_total_pixels
                        ?? 0
                    )
                } px`;

            campos.movimentoTempo.textContent =
                `Tempo observado: ${
                    formatarNumeroMovimento(
                        movimento
                            .tempo_observado_segundos
                        ?? 0
                    )
                } s`;

            campos.movimentoAmostras.textContent =
                `Amostras de movimento: ${
                    movimento
                        .quantidade_amostras
                    || 1
                }`;

            campos.movimentoDescricao.textContent =
                `Descrição do movimento: ${
                    movimento.descricao
                    || "-"
                }`;
        }

        function montarDistribuicao(
            contexto
        ) {
            const partes = [];

            if (contexto.pessoas_esquerda) {
                partes.push(
                    `${contexto.pessoas_esquerda} à esquerda`
                );
            }

            if (contexto.pessoas_centro) {
                partes.push(
                    `${contexto.pessoas_centro} no centro`
                );
            }

            if (contexto.pessoas_direita) {
                partes.push(
                    `${contexto.pessoas_direita} à direita`
                );
            }

            if (partes.length === 0) {
                return "sem distribuição";
            }

            return partes.join(", ");
        }

        function preencherContextoCena(
            contexto,
            campos
        ) {
            campos.contexto.style.display =
                "block";

            campos.contextoQuantidade.textContent =
                `Pessoas identificadas: ${
                    contexto.quantidade_pessoas
                    ?? 0
                }`;

            campos.contextoDistribuicao.textContent =
                `Distribuição: ${
                    montarDistribuicao(
                        contexto
                    )
                }`;

            campos.contextoProximidades.textContent =
                `Pares muito próximos: ${
                    contexto.pares_muito_proximos
                    ?? 0
                } | Pares próximos: ${
                    contexto.pares_proximos
                    ?? 0
                } | Pares separados: ${
                    contexto.pares_separados
                    ?? 0
                }`;

            const pessoas =
                Array.isArray(
                    contexto.pessoas
                )
                    ? contexto.pessoas
                    : [];

            if (pessoas.length > 0) {
                const detalhes =
                    pessoas
                    .slice(0, 8)
                    .map(
                        function (pessoa) {
                            return (
                                `Pessoa ${pessoa.indice}: `
                                + `${pessoa.posicao_horizontal || "-"}, `
                                + `${pessoa.posicao_vertical || "-"}, `
                                + `tamanho ${pessoa.tamanho_no_quadro || "-"}, `
                                + `${pessoa.percentual_quadro ?? "-"}% do quadro`
                            );
                        }
                    );

                if (pessoas.length > 8) {
                    detalhes.push(
                        `E mais ${
                            pessoas.length - 8
                        } pessoa(s).`
                    );
                }

                campos.contextoPessoas.textContent =
                    "Detalhes:\n"
                    + detalhes.join("\n");

            } else {
                campos.contextoPessoas.textContent =
                    "Detalhes: nenhuma pessoa válida.";
            }

            campos.contextoDescricao.textContent =
                `Descrição da cena: ${
                    contexto.descricao
                    || "-"
                }`;
        }

        function atualizarCartao(
            card,
            evento
        ) {
            const campos =
                obterCamposCard(card);

            if (evento.imagem) {
                preencherRecorte(
                    evento.imagem,
                    campos
                );
            }

            if (evento.imagem_rosto) {
                preencherRosto(
                    evento.imagem_rosto,
                    campos
                );
            }

            if (evento.imagem_cena) {
                preencherCenaCompleta(
                    evento.imagem_cena,
                    evento.quantidade_boxes_cena,
                    campos
                );
            }

            if (evento.camera) {
                campos.camera.textContent =
                    evento.camera;
            }

            campos.status.textContent =
                traduzirStatus(
                    evento.status
                );

            campos.status.className =
                `evento-status ${evento.status || ""}`;

            if (evento.tipo) {
                campos.tipo.textContent =
                    `Evento: ${evento.tipo}`;
            }

            if (
                evento.status === "exited"
            ) {
                campos.horario.textContent =
                    `Saída: ${
                        evento.datetime || "-"
                    }`;

            } else {
                campos.horario.textContent =
                    `Última captura: ${
                        evento.datetime || "-"
                    }`;
            }

            campos.pessoaId.textContent =
                `Pessoa: ${
                    evento.pessoa_id || "-"
                }`;

            campos.quantidade.textContent =
                `Detecções: ${
                    evento.quantidade_deteccoes
                    || 1
                }`;

            if (evento.aparencia) {
                preencherAparencia(
                    evento.aparencia,
                    campos
                );
            }

            if (evento.movimento) {
                preencherMovimento(
                    evento.movimento,
                    campos
                );
            }

            if (evento.contexto_cena) {
                preencherContextoCena(
                    evento.contexto_cena,
                    campos
                );
            }

            card.classList.remove(
                "atualizado",
                "saiu"
            );

            if (
                evento.status === "updated"
            ) {
                card.classList.add(
                    "atualizado"
                );

                eventosElemento.prepend(
                    card
                );

                setTimeout(
                    function () {
                        card.classList.remove(
                            "atualizado"
                        );
                    },
                    1500
                );
            }

            if (
                evento.status === "exited"
            ) {
                card.classList.add(
                    "saiu"
                );
            }
        }

        function limitarQuantidadeCartoes() {
            while (
                eventosElemento.children.length
                > 50
            ) {
                const ultimo =
                    eventosElemento
                    .lastElementChild;

                if (!ultimo) {
                    break;
                }

                const pessoaId =
                    ultimo.dataset.pessoaId;

                if (pessoaId) {
                    const statusRemovido =
                        statusPorPessoa.get(
                            pessoaId
                        );

                    if (
                        statusRemovido
                        === "exited"
                    ) {
                        pessoasSairam =
                            Math.max(
                                0,
                                pessoasSairam - 1
                            );
                    }

                    else if (statusRemovido) {
                        pessoasAtivas =
                            Math.max(
                                0,
                                pessoasAtivas - 1
                            );
                    }

                    totalPessoas =
                        Math.max(
                            0,
                            totalPessoas - 1
                        );

                    cartoesPorPessoa.delete(
                        pessoaId
                    );

                    statusPorPessoa.delete(
                        pessoaId
                    );
                }

                ultimo.remove();
            }

            atualizarResumo();
        }

        atualizarResumo();
        conectarWebSocket();
    </script>
