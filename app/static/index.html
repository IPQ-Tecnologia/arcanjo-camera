<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Camera Events Panel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: #f3f4f6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #191e29;
            border-bottom: 1px solid #2d3443;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        main {
            padding: 30px;
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            min-width: 180px;
            padding: 18px;
            background: #191e29;
            border: 1px solid #2d3443;
            border-radius: 10px;
        }

        .summary-card span {
            display: block;
            color: #9ca3af;
            font-size: 14px;
        }

        .summary-card strong {
            display: block;
            margin-top: 8px;
            font-size: 28px;
        }

        #events {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(400px, 1fr)
            );
            gap: 20px;
        }

        .event-card {
            overflow: hidden;
            background: #191e29;
            border: 1px solid #2d3443;
            border-radius: 10px;
            transition:
                border-color 0.2s,
                transform 0.2s,
                opacity 0.2s;
        }

        .event-card.updated {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .event-card.exited {
            opacity: 0.55;
            border-color: #6b7280;
        }

        .event-images {
            display: flex;
            flex-direction: column;
            background: #05070a;
        }

        .image-block {
            display: none;
            border-bottom: 1px solid #2d3443;
        }

        .image-block:last-child {
            border-bottom: none;
        }

        .image-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 38px;
            padding: 9px 12px;
            background: #111827;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: bold;
        }

        .image-count {
            color: #86efac;
            font-size: 12px;
        }

        .event-image {
            display: block;
            width: 100%;
            background: #05070a;
            cursor: zoom-in;
        }

        .crop-image {
            height: 260px;
            object-fit: contain;
        }

        .face-image {
            height: 230px;
            object-fit: contain;
            background: #05070a;
        }

        .scene-image {
            aspect-ratio: 16 / 9;
            max-height: 440px;
            object-fit: contain;
        }

        .event-data {
            padding: 15px;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .event-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .event-status {
            padding: 5px 9px;
            border-radius: 999px;
            background: #374151;
            font-size: 12px;
            font-weight: bold;
        }

        .event-status.entered {
            background: #166534;
            color: #dcfce7;
        }

        .event-status.updated {
            background: #1e40af;
            color: #dbeafe;
        }

        .event-status.exited {
            background: #4b5563;
            color: #f3f4f6;
        }

        .event-data p {
            margin: 6px 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .visual-appearance,
        .person-movement,
        .scene-context {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #2d3443;
        }

        .section-title {
            margin: 0 0 10px;
            font-size: 14px;
            color: #93c5fd;
        }

        .person-movement .section-title {
            color: #fbbf24;
        }

        .scene-context .section-title {
            color: #86efac;
        }

        .description {
            line-height: 1.45;
        }

        .person-details {
            line-height: 1.5;
            white-space: pre-line;
        }

        .color-swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 6px;
            border: 1px solid #64748b;
            border-radius: 50%;
            vertical-align: -1px;
        }

        .empty {
            padding: 40px;
            color: #9ca3af;
            text-align: center;
            background: #191e29;
            border: 1px dashed #374151;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            main {
                padding: 20px;
            }

            #events {
                grid-template-columns: 1fr;
            }

            .summary-card {
                flex: 1;
                min-width: 140px;
            }

            .crop-image {
                height: 230px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Camera Events Panel</h1>

        <div class="connection-status">
            <div
                id="status-dot"
                class="status-dot"
            ></div>

            <span id="status-text">
                Connecting...
            </span>
        </div>
    </header>

    <main>
        <section class="summary">
            <div class="summary-card">
                <span>Active people</span>
                <strong id="active-people">0</strong>
            </div>

            <div class="summary-card">
                <span>People who left</span>
                <strong id="people-left">0</strong>
            </div>

            <div class="summary-card">
                <span>Total shown</span>
                <strong id="total-people">0</strong>
            </div>

            <div class="summary-card">
                <span>Events processed</span>
                <strong id="total-events">0</strong>
            </div>
        </section>

        <section id="events">
            <div
                id="empty-message"
                class="empty"
            >
                Waiting for camera events...
            </div>
        </section>
    </main>

    <script>
        const statusDot =
            document.getElementById(
                "status-dot"
            );

        const statusText =
            document.getElementById(
                "status-text"
            );

        const activePeopleElement =
            document.getElementById(
                "active-people"
            );

        const peopleLeftElement =
            document.getElementById(
                "people-left"
            );

        const totalPeopleElement =
            document.getElementById(
                "total-people"
            );

        const totalEventsElement =
            document.getElementById(
                "total-events"
            );

        const eventsElement =
            document.getElementById(
                "events"
            );

        const cardsByPerson =
            new Map();

        const statusByPerson =
            new Map();

        let activePeople = 0;
        let peopleLeft = 0;
        let totalPeople = 0;
        let totalEvents = 0;
        let heartbeatId = null;

        function translateStatus(status) {
            const translations = {
                entered: "Entered",
                updated: "Updated",
                suppressed: "Repeated",
                exited: "Left"
            };

            return (
                translations[status]
                || status
                || "Detected"
            );
        }

        function updateSummary() {
            activePeopleElement.textContent =
                activePeople;

            peopleLeftElement.textContent =
                peopleLeft;

            totalPeopleElement.textContent =
                totalPeople;

            totalEventsElement.textContent =
                totalEvents;
        }

        function recordStatusChange(
            personId,
            newStatus
        ) {
            const previousStatus =
                statusByPerson.get(
                    personId
                );

            if (!previousStatus) {
                totalPeople += 1;

                if (newStatus === "exited") {
                    peopleLeft += 1;
                } else {
                    activePeople += 1;
                }
            }

            else if (
                previousStatus !== "exited"
                && newStatus === "exited"
            ) {
                activePeople = Math.max(
                    0,
                    activePeople - 1
                );

                peopleLeft += 1;
            }

            else if (
                previousStatus === "exited"
                && newStatus !== "exited"
            ) {
                peopleLeft = Math.max(
                    0,
                    peopleLeft - 1
                );

                activePeople += 1;
            }

            statusByPerson.set(
                personId,
                newStatus
            );

            updateSummary();
        }

        function connectWebSocket() {
            const protocol =
                window.location.protocol === "https:"
                    ? "wss"
                    : "ws";

            const address =
                `${protocol}://${window.location.host}/ws/eventos`;

            const socket =
                new WebSocket(address);

            socket.onopen = function () {
                statusText.textContent =
                    "Connected";

                statusDot.className =
                    "status-dot connected";

                if (heartbeatId) {
                    clearInterval(
                        heartbeatId
                    );
                }

                heartbeatId = setInterval(
                    function () {
                        if (
                            socket.readyState
                            === WebSocket.OPEN
                        ) {
                            socket.send(
                                "ping"
                            );
                        }
                    },
                    20000
                );
            };

            socket.onmessage =
                function (message) {
                    try {
                        const event =
                            JSON.parse(
                                message.data
                            );

                        processEvent(
                            event
                        );

                    } catch (error) {
                        console.error(
                            "Error parsing event:",
                            error
                        );
                    }
                };

            socket.onclose = function () {
                statusText.textContent =
                    "Disconnected — reconnecting...";

                statusDot.className =
                    "status-dot disconnected";

                if (heartbeatId) {
                    clearInterval(
                        heartbeatId
                    );

                    heartbeatId = null;
                }

                setTimeout(
                    connectWebSocket,
                    2000
                );
            };

            socket.onerror = function () {
                socket.close();
            };
        }

        function processEvent(event) {
            if (
                event.status
                === "appearance_updated"
            ) {
                updatePartialEvent(
                    event
                );

                return;
            }

            if (
                event.status
                === "suppressed"
            ) {
                return;
            }

            const personId =
                event.pessoa_id
                || event.evento_id;

            if (!personId) {
                console.warn(
                    "Event with no identifier:",
                    event
                );

                return;
            }

            const existingCard =
                cardsByPerson.get(
                    personId
                );

            if (
                event.status === "exited"
                && !existingCard
            ) {
                return;
            }

            recordStatusChange(
                personId,
                event.status || "entered"
            );

            totalEvents += 1;
            updateSummary();

            if (existingCard) {
                updateCard(
                    existingCard,
                    event
                );

                return;
            }

            createCard(
                personId,
                event
            );
        }

        function createElement(
            tag,
            field,
            className = ""
        ) {
            const element =
                document.createElement(
                    tag
                );

            if (field) {
                element.dataset.field =
                    field;
            }

            if (className) {
                element.className =
                    className;
            }

            return element;
        }

        function getCardFields(card) {
            return {
                cropBlock: card.querySelector(
                    '[data-field="crop-block"]'
                ),

                cropImage: card.querySelector(
                    '[data-field="crop-image"]'
                ),

                faceBlock: card.querySelector(
                    '[data-field="face-block"]'
                ),

                faceImage: card.querySelector(
                    '[data-field="face-image"]'
                ),

                sceneBlock: card.querySelector(
                    '[data-field="scene-block"]'
                ),

                sceneTitle: card.querySelector(
                    '[data-field="scene-title"]'
                ),

                boxCount: card.querySelector(
                    '[data-field="box-count"]'
                ),

                sceneImage: card.querySelector(
                    '[data-field="scene-image"]'
                ),

                camera: card.querySelector(
                    '[data-field="camera"]'
                ),

                status: card.querySelector(
                    '[data-field="status"]'
                ),

                type: card.querySelector(
                    '[data-field="type"]'
                ),

                time: card.querySelector(
                    '[data-field="time"]'
                ),

                personId: card.querySelector(
                    '[data-field="person-id"]'
                ),

                count: card.querySelector(
                    '[data-field="count"]'
                ),

                appearance: card.querySelector(
                    '[data-field="appearance"]'
                ),

                appearanceTitle: card.querySelector(
                    '[data-field="appearance-title"]'
                ),

                clothingColor: card.querySelector(
                    '[data-field="clothing-color"]'
                ),

                position: card.querySelector(
                    '[data-field="position"]'
                ),

                size: card.querySelector(
                    '[data-field="size"]'
                ),

                percentage: card.querySelector(
                    '[data-field="percentage"]'
                ),

                sampleCount: card.querySelector(
                    '[data-field="sample-count"]'
                ),

                appearanceDescription: card.querySelector(
                    '[data-field="appearance-description"]'
                ),

                movement: card.querySelector(
                    '[data-field="movement"]'
                ),

                movementHorizontal: card.querySelector(
                    '[data-field="movement-horizontal"]'
                ),

                movementVertical: card.querySelector(
                    '[data-field="movement-vertical"]'
                ),

                movementTrend: card.querySelector(
                    '[data-field="movement-trend"]'
                ),

                movementSpeed: card.querySelector(
                    '[data-field="movement-speed"]'
                ),

                movementDistance: card.querySelector(
                    '[data-field="movement-distance"]'
                ),

                movementTime: card.querySelector(
                    '[data-field="movement-time"]'
                ),

                movementSamples: card.querySelector(
                    '[data-field="movement-samples"]'
                ),

                movementDescription: card.querySelector(
                    '[data-field="movement-description"]'
                ),

                context: card.querySelector(
                    '[data-field="context"]'
                ),

                contextCount: card.querySelector(
                    '[data-field="context-count"]'
                ),

                contextDistribution: card.querySelector(
                    '[data-field="context-distribution"]'
                ),

                contextProximities: card.querySelector(
                    '[data-field="context-proximities"]'
                ),

                contextPeople: card.querySelector(
                    '[data-field="context-people"]'
                ),

                contextDescription: card.querySelector(
                    '[data-field="context-description"]'
                )
            };
        }

        function updatePartialEvent(
            event
        ) {
            const personId =
                event.pessoa_id
                || event.evento_id;

            const card =
                cardsByPerson.get(
                    personId
                );

            if (!card) {
                console.warn(
                    "Update received with no card:",
                    personId
                );

                return;
            }

            const fields =
                getCardFields(card);

            fields.count.textContent =
                `Detections: ${
                    event.quantidade_deteccoes
                    || 1
                }`;

            if (event.imagem) {
                fillCrop(
                    event.imagem,
                    fields
                );
            }

            if (event.imagem_rosto) {
                fillFace(
                    event.imagem_rosto,
                    fields
                );
            }

            if (event.aparencia) {
                fillAppearance(
                    event.aparencia,
                    fields
                );
            }

            if (event.movimento) {
                fillMovement(
                    event.movimento,
                    fields
                );
            }

            if (event.contexto_cena) {
                fillSceneContext(
                    event.contexto_cena,
                    fields
                );
            }

            if (event.imagem_cena) {
                fillFullScene(
                    event.imagem_cena,
                    event.quantidade_boxes_cena,
                    fields
                );
            }

            card.classList.add(
                "updated"
            );

            setTimeout(
                function () {
                    card.classList.remove(
                        "updated"
                    );
                },
                1000
            );
        }

        function createCard(
            personId,
            event
        ) {
            const emptyMessage =
                document.getElementById(
                    "empty-message"
                );

            if (emptyMessage) {
                emptyMessage.remove();
            }

            const card =
                createElement(
                    "article",
                    "",
                    "event-card"
                );

            card.dataset.personId =
                personId;

            const eventImages =
                createElement(
                    "section",
                    "",
                    "event-images"
                );

            const cropBlock =
                createElement(
                    "div",
                    "crop-block",
                    "image-block"
                );

            const cropTitle =
                createElement(
                    "div",
                    "",
                    "image-title"
                );

            cropTitle.textContent =
                "Individual crop";

            const cropImage =
                createElement(
                    "img",
                    "crop-image",
                    "event-image crop-image"
                );

            cropImage.alt =
                "Individual crop of the person";

            cropImage.title =
                "Click to enlarge";

            cropImage.addEventListener(
                "click",
                () => {
                    openEnlargedImage(
                        cropImage.src,
                        "Individual crop"
                    );
                }
            );

            cropBlock.appendChild(
                cropTitle
            );

            cropBlock.appendChild(
                cropImage
            );

            const faceBlock =
                createElement(
                    "div",
                    "face-block",
                    "image-block"
                );

            const faceTitle =
                createElement(
                    "div",
                    "",
                    "image-title"
                );

            faceTitle.textContent =
                "Face crop";

            const faceImage =
                createElement(
                    "img",
                    "face-image",
                    "event-image face-image"
                );

            faceImage.alt =
                "Face crop of the person";

            faceBlock.appendChild(
                faceTitle
            );

            faceBlock.appendChild(
                faceImage
            );

            const sceneBlock =
                createElement(
                    "div",
                    "scene-block",
                    "image-block"
                );

            const sceneHeader =
                createElement(
                    "div",
                    "",
                    "image-title"
                );

            const sceneTitle =
                createElement(
                    "span",
                    "scene-title"
                );

            sceneTitle.textContent =
                "Full scene";

            const boxCount =
                createElement(
                    "span",
                    "box-count",
                    "image-count"
                );

            boxCount.textContent =
                "0 detections";

            sceneHeader.appendChild(
                sceneTitle
            );

            sceneHeader.appendChild(
                boxCount
            );

            const sceneImage =
                createElement(
                    "img",
                    "scene-image",
                    "event-image scene-image"
                );

            sceneImage.alt =
                "Full scene with detections";

            sceneImage.title =
                "Click to enlarge";

            sceneImage.addEventListener(
                "click",
                () => {
                    openEnlargedImage(
                        sceneImage.src,
                        "Full camera scene"
                    );
                }
            );

            sceneBlock.appendChild(
                sceneHeader
            );

            sceneBlock.appendChild(
                sceneImage
            );

            eventImages.appendChild(
                cropBlock
            );

            eventImages.appendChild(
                faceBlock
            );

            eventImages.appendChild(
                sceneBlock
            );

            const data =
                createElement(
                    "div",
                    "",
                    "event-data"
                );

            const header =
                createElement(
                    "div",
                    "",
                    "event-header"
                );

            const title =
                createElement(
                    "h2",
                    "camera"
                );

            const status =
                createElement(
                    "span",
                    "status",
                    "event-status"
                );

            header.appendChild(
                title
            );

            header.appendChild(
                status
            );

            const type =
                createElement(
                    "p",
                    "type"
                );

            const time =
                createElement(
                    "p",
                    "time"
                );

            const personIdField =
                createElement(
                    "p",
                    "person-id"
                );

            const count =
                createElement(
                    "p",
                    "count"
                );

            const appearance =
                createElement(
                    "section",
                    "appearance",
                    "visual-appearance"
                );

            const appearanceTitle =
                createElement(
                    "h3",
                    "appearance-title",
                    "section-title"
                );

            appearanceTitle.textContent =
                "Stable appearance";

            const clothingColor =
                createElement(
                    "p",
                    "clothing-color"
                );

            const position =
                createElement(
                    "p",
                    "position"
                );

            const size =
                createElement(
                    "p",
                    "size"
                );

            const percentage =
                createElement(
                    "p",
                    "percentage"
                );

            const sampleCount =
                createElement(
                    "p",
                    "sample-count"
                );

            const appearanceDescription =
                createElement(
                    "p",
                    "appearance-description",
                    "description"
                );

            appearance.appendChild(
                appearanceTitle
            );

            appearance.appendChild(
                clothingColor
            );

            appearance.appendChild(
                position
            );

            appearance.appendChild(
                size
            );

            appearance.appendChild(
                percentage
            );

            appearance.appendChild(
                sampleCount
            );

            appearance.appendChild(
                appearanceDescription
            );

            const movement =
                createElement(
                    "section",
                    "movement",
                    "person-movement"
                );

            const movementTitle =
                createElement(
                    "h3",
                    "",
                    "section-title"
                );

            movementTitle.textContent =
                "Movement and dwell time";

            const movementHorizontal =
                createElement(
                    "p",
                    "movement-horizontal"
                );

            const movementVertical =
                createElement(
                    "p",
                    "movement-vertical"
                );

            const movementTrend =
                createElement(
                    "p",
                    "movement-trend"
                );

            const movementSpeed =
                createElement(
                    "p",
                    "movement-speed"
                );

            const movementDistance =
                createElement(
                    "p",
                    "movement-distance"
                );

            const movementTime =
                createElement(
                    "p",
                    "movement-time"
                );

            const movementSamples =
                createElement(
                    "p",
                    "movement-samples"
                );

            const movementDescription =
                createElement(
                    "p",
                    "movement-description",
                    "description"
                );

            movement.appendChild(
                movementTitle
            );

            movement.appendChild(
                movementHorizontal
            );

            movement.appendChild(
                movementVertical
            );

            movement.appendChild(
                movementTrend
            );

            movement.appendChild(
                movementSpeed
            );

            movement.appendChild(
                movementDistance
            );

            movement.appendChild(
                movementTime
            );

            movement.appendChild(
                movementSamples
            );

            movement.appendChild(
                movementDescription
            );

            const context =
                createElement(
                    "section",
                    "context",
                    "scene-context"
                );

            const contextTitle =
                createElement(
                    "h3",
                    "",
                    "section-title"
                );

            contextTitle.textContent =
                "Scene context";

            const contextCount =
                createElement(
                    "p",
                    "context-count"
                );

            const contextDistribution =
                createElement(
                    "p",
                    "context-distribution"
                );

            const contextProximities =
                createElement(
                    "p",
                    "context-proximities"
                );

            const contextPeople =
                createElement(
                    "p",
                    "context-people",
                    "person-details"
                );

            const contextDescription =
                createElement(
                    "p",
                    "context-description",
                    "description"
                );

            context.appendChild(
                contextTitle
            );

            context.appendChild(
                contextCount
            );

            context.appendChild(
                contextDistribution
            );

            context.appendChild(
                contextProximities
            );

            context.appendChild(
                contextPeople
            );

            context.appendChild(
                contextDescription
            );

            data.appendChild(
                header
            );

            data.appendChild(
                type
            );

            data.appendChild(
                time
            );

            data.appendChild(
                personIdField
            );

            data.appendChild(
                count
            );

            data.appendChild(
                appearance
            );

            data.appendChild(
                movement
            );

            data.appendChild(
                context
            );

            card.appendChild(
                eventImages
            );

            card.appendChild(
                data
            );

            eventsElement.prepend(
                card
            );

            cardsByPerson.set(
                personId,
                card
            );

            updateCard(
                card,
                event
            );

            limitCardCount();
        }

        function openEnlargedImage(
            src,
            title
        ) {
            if (!src) {
                return;
            }

            const newWindow = window.open(
                "",
                "_blank"
            );

            if (!newWindow) {
                return;
            }

            newWindow.document.title =
                title || "Enlarged image";

            newWindow.document.body.style.margin =
                "0";

            newWindow.document.body.style.background =
                "#05070a";

            newWindow.document.body.style.width =
                "100vw";

            newWindow.document.body.style.height =
                "100vh";

            newWindow.document.body.style.display =
                "flex";

            newWindow.document.body.style.alignItems =
                "center";

            newWindow.document.body.style.justifyContent =
                "center";

            newWindow.document.body.style.overflow =
                "hidden";

            const img =
                newWindow.document.createElement(
                    "img"
                );

            img.src = src;
            img.alt =
                title || "Enlarged image";

            img.style.width = "100vw";
            img.style.height = "100vh";
            img.style.objectFit = "contain";
            img.style.background = "#05070a";

            newWindow.document.body.appendChild(
                img
            );

            newWindow.opener = null;
        }

        function fillCrop(
            imageBase64,
            fields
        ) {
            if (!imageBase64) {
                return;
            }

            fields.cropBlock.style.display =
                "block";

            fields.cropImage.src =
                `data:image/jpeg;base64,${imageBase64}`;
        }

        function fillFace(
            imageBase64,
            fields
        ) {
            if (
                !imageBase64
                || !fields.faceBlock
                || !fields.faceImage
            ) {
                return;
            }

            fields.faceBlock.style.display =
                "block";

            fields.faceImage.src =
                `data:image/jpeg;base64,${imageBase64}`;
        }

        function fillFullScene(
            imageBase64,
            boxCount,
            fields
        ) {
            if (!imageBase64) {
                return;
            }

            const count =
                Number(
                    boxCount || 0
                );

            fields.sceneBlock.style.display =
                "block";

            fields.sceneImage.src =
                `data:image/jpeg;base64,${imageBase64}`;

            fields.sceneTitle.textContent =
                "Full scene with detections";

            if (count === 1) {
                fields.boxCount.textContent =
                    "1 detection";
            } else {
                fields.boxCount.textContent =
                    `${count} detections`;
            }
        }

        function fillAppearance(
            appearance,
            fields
        ) {
            fields.appearance.style.display =
                "block";

            const predominantColor =
                appearance.cor_roupa_predominante
                || "indefinida";

            const colorConfirmed =
                predominantColor !== "indefinida";

            if (fields.appearanceTitle) {
                fields.appearanceTitle.textContent =
                    colorConfirmed
                        ? "Stable appearance"
                        : "Appearance being analyzed";
            }

            const rgb =
                appearance.rgb_medio;

            let colorSwatch = "";

            if (
                colorConfirmed
                && Array.isArray(rgb)
                && rgb.length === 3
            ) {
                colorSwatch =
                    `<span
                        class="color-swatch"
                        style="
                            background-color:
                            rgb(
                                ${rgb[0]},
                                ${rgb[1]},
                                ${rgb[2]}
                            );
                        "
                    ></span>`;
            }

            if (colorConfirmed) {
                fields.clothingColor.innerHTML =
                    `${colorSwatch}Predominant color: ${
                        predominantColor
                    }`;
            } else {
                fields.clothingColor.textContent =
                    "Predominant color: analyzing...";
            }

            fields.position.textContent =
                `Current position: ${
                    appearance.posicao_atual
                    || "-"
                }`;

            fields.size.textContent =
                `Predominant size: ${
                    appearance.tamanho_predominante
                    || "-"
                }`;

            fields.percentage.textContent =
                `Average area occupied: ${
                    appearance.percentual_medio_quadro
                    ?? "-"
                }%`;

            fields.sampleCount.textContent =
                `Samples analyzed: ${
                    appearance.quantidade_amostras
                    || 1
                }`;

            if (colorConfirmed) {
                fields.appearanceDescription.textContent =
                    `Stable description: ${
                        appearance.descricao
                        || "-"
                    }`;
            } else {
                fields.appearanceDescription.textContent =
                    "Waiting for consistent readings "
                    + "to confirm the clothing color.";
            }
        }

        function formatMovementText(
            value
        ) {
            if (
                value === null
                || value === undefined
                || value === ""
            ) {
                return "-";
            }

            const text = String(value)
                .replaceAll("_", " ");

            return (
                text.charAt(0).toUpperCase()
                + text.slice(1)
            );
        }

        function formatMovementNumber(
            value,
            decimalPlaces = 2
        ) {
            const number = Number(value);

            if (!Number.isFinite(number)) {
                return "-";
            }

            return number.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits:
                        decimalPlaces,
                    maximumFractionDigits:
                        decimalPlaces
                }
            );
        }

        function fillMovement(
            movement,
            fields
        ) {
            if (
                !movement
                || !fields.movement
            ) {
                return;
            }

            fields.movement.style.display =
                "block";

            fields.movementHorizontal.textContent =
                `Horizontal direction: ${
                    formatMovementText(
                        movement
                            .movimento_horizontal
                    )
                }`;

            fields.movementVertical.textContent =
                `Vertical direction: ${
                    formatMovementText(
                        movement
                            .movimento_vertical
                    )
                }`;

            fields.movementTrend.textContent =
                `Apparent distance: ${
                    formatMovementText(
                        movement
                            .tendencia_distancia
                    )
                }`;

            fields.movementSpeed.textContent =
                `Approximate speed: ${
                    formatMovementNumber(
                        movement
                            .velocidade_pixels_segundo
                        ?? 0
                    )
                } px/s`;

            fields.movementDistance.textContent =
                `Distance traveled: ${
                    formatMovementNumber(
                        movement
                            .distancia_total_pixels
                        ?? 0
                    )
                } px`;

            fields.movementTime.textContent =
                `Observed time: ${
                    formatMovementNumber(
                        movement
                            .tempo_observado_segundos
                        ?? 0
                    )
                } s`;

            fields.movementSamples.textContent =
                `Movement samples: ${
                    movement
                        .quantidade_amostras
                    || 1
                }`;

            fields.movementDescription.textContent =
                `Movement description: ${
                    movement.descricao
                    || "-"
                }`;
        }

        function buildDistribution(
            context
        ) {
            const parts = [];

            if (context.pessoas_esquerda) {
                parts.push(
                    `${context.pessoas_esquerda} on the left`
                );
            }

            if (context.pessoas_centro) {
                parts.push(
                    `${context.pessoas_centro} in the center`
                );
            }

            if (context.pessoas_direita) {
                parts.push(
                    `${context.pessoas_direita} on the right`
                );
            }

            if (parts.length === 0) {
                return "no distribution";
            }

            return parts.join(", ");
        }

        function fillSceneContext(
            context,
            fields
        ) {
            fields.context.style.display =
                "block";

            fields.contextCount.textContent =
                `People identified: ${
                    context.quantidade_pessoas
                    ?? 0
                }`;

            fields.contextDistribution.textContent =
                `Distribution: ${
                    buildDistribution(
                        context
                    )
                }`;

            fields.contextProximities.textContent =
                `Very close pairs: ${
                    context.pares_muito_proximos
                    ?? 0
                } | Close pairs: ${
                    context.pares_proximos
                    ?? 0
                } | Separated pairs: ${
                    context.pares_separados
                    ?? 0
                }`;

            const people =
                Array.isArray(
                    context.pessoas
                )
                    ? context.pessoas
                    : [];

            if (people.length > 0) {
                const details =
                    people
                    .slice(0, 8)
                    .map(
                        function (person) {
                            return (
                                `Person ${person.indice}: `
                                + `${person.posicao_horizontal || "-"}, `
                                + `${person.posicao_vertical || "-"}, `
                                + `size ${person.tamanho_no_quadro || "-"}, `
                                + `${person.percentual_quadro ?? "-"}% of frame`
                            );
                        }
                    );

                if (people.length > 8) {
                    details.push(
                        `And ${
                            people.length - 8
                        } more person(s).`
                    );
                }

                fields.contextPeople.textContent =
                    "Details:\n"
                    + details.join("\n");

            } else {
                fields.contextPeople.textContent =
                    "Details: no valid person.";
            }

            fields.contextDescription.textContent =
                `Scene description: ${
                    context.descricao
                    || "-"
                }`;
        }

        function updateCard(
            card,
            event
        ) {
            const fields =
                getCardFields(card);

            if (event.imagem) {
                fillCrop(
                    event.imagem,
                    fields
                );
            }

            if (event.imagem_rosto) {
                fillFace(
                    event.imagem_rosto,
                    fields
                );
            }

            if (event.imagem_cena) {
                fillFullScene(
                    event.imagem_cena,
                    event.quantidade_boxes_cena,
                    fields
                );
            }

            if (event.camera) {
                fields.camera.textContent =
                    event.camera;
            }

            fields.status.textContent =
                translateStatus(
                    event.status
                );

            fields.status.className =
                `event-status ${event.status || ""}`;

            if (event.tipo) {
                fields.type.textContent =
                    `Event: ${event.tipo}`;
            }

            if (
                event.status === "exited"
            ) {
                fields.time.textContent =
                    `Exit: ${
                        event.datetime || "-"
                    }`;

            } else {
                fields.time.textContent =
                    `Last capture: ${
                        event.datetime || "-"
                    }`;
            }

            fields.personId.textContent =
                `Person: ${
                    event.pessoa_id || "-"
                }`;

            fields.count.textContent =
                `Detections: ${
                    event.quantidade_deteccoes
                    || 1
                }`;

            if (event.aparencia) {
                fillAppearance(
                    event.aparencia,
                    fields
                );
            }

            if (event.movimento) {
                fillMovement(
                    event.movimento,
                    fields
                );
            }

            if (event.contexto_cena) {
                fillSceneContext(
                    event.contexto_cena,
                    fields
                );
            }

            card.classList.remove(
                "updated",
                "exited"
            );

            if (
                event.status === "updated"
            ) {
                card.classList.add(
                    "updated"
                );

                eventsElement.prepend(
                    card
                );

                setTimeout(
                    function () {
                        card.classList.remove(
                            "updated"
                        );
                    },
                    1500
                );
            }

            if (
                event.status === "exited"
            ) {
                card.classList.add(
                    "exited"
                );
            }
        }

        function limitCardCount() {
            while (
                eventsElement.children.length
                > 50
            ) {
                const last =
                    eventsElement
                    .lastElementChild;

                if (!last) {
                    break;
                }

                const personId =
                    last.dataset.personId;

                if (personId) {
                    const removedStatus =
                        statusByPerson.get(
                            personId
                        );

                    if (
                        removedStatus
                        === "exited"
                    ) {
                        peopleLeft =
                            Math.max(
                                0,
                                peopleLeft - 1
                            );
                    }

                    else if (removedStatus) {
                        activePeople =
                            Math.max(
                                0,
                                activePeople - 1
                            );
                    }

                    totalPeople =
                        Math.max(
                            0,
                            totalPeople - 1
                        );

                    cardsByPerson.delete(
                        personId
                    );

                    statusByPerson.delete(
                        personId
                    );
                }

                last.remove();
            }

            updateSummary();
        }

        updateSummary();
        connectWebSocket();
    </script>
</body>
</html>
